<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Poster</title>

    Google Font
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="hero-section">

        <!-- Movie 1 -->
        <div class="poster-card">
            <img class="poster" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQquFWi3stBdnQKgy9exFZBhFJZHnvRCNtEDjteIhuHT-HsBhjWHjZKAVPV&s=10" alt="John Wick Poster">
            <h2>John Wick</h2>
            <p>⭐⭐⭐⭐</p>
        </div>

        <!-- Movie 2 -->
        <div class="poster-card">
            <img class="poster" src="https://cdn.europosters.eu/image/hp/106829.jpg" alt="Harry Potter Poster">
            <h2>Harry Potter</h2>
            <p>Rating : ⭐⭐⭐⭐⭐</p>
        </div>

        <!-- Movie 3 -->
        <div class="poster-card">
            <img class="poster" src="https://m.media-amazon.com/images/I/51eUcTAFoLL.jpg" alt="Spider-Man Poster">

            <p>Rating :⭐⭐⭐⭐⭐</p>
        </div>

            <p>⭐⭐⭐</p>
        </div>

        <div class="poster-card">
            <img class="poster" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTIp2fY_BXQWJ9I0MMOE43dz8nUHuVl_lc0vAC6CughMDTra2AbkUDRvOOi&s=10" alt="The Jimmy Stewart Poster">
            <h2>The Jimmy Stewart</h2>
            <p>Rating :⭐⭐⭐⭐⭐</p>
        </div>

        <!-- Movie 6 -->

            <p> Rating :⭐⭐⭐⭐</p>
        </div>

        <!-- Movie 8 -->
        <div class="poster-card">
            <img class="poster" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT9mJ_yGr51LLzAgly_RQDi-Fk1fWHysKRdJXPqnZj3aS7YXI75KqNdYdI&s=10" alt="Mardaani 2 Poster">
